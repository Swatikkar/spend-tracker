<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spend Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">      
      <section id="authSection" class="auth-section">
        <h1>Spend Tracker</h1>
        <div id="authForm">
          <h2>Login</h2>
          <form id="loginForm">
            <div class="form-group">
              <label for="loginEmail">Email:</label>
              <input type="email" id="loginEmail" required />
            </div>
            <div class="form-group">
              <label for="loginPassword">Password:</label>
              <input type="password" id="loginPassword" required />
            </div>
            <button type="submit">Login</button>
            <p>
              Don't have an account?
              <a href="#" id="toggleRegister">Register here</a>
            </p>
          </form>

          <form id="registerForm" style="display: none">
            <h2>Register</h2>
            <div class="form-group">
              <label for="registerEmail">Email:</label>
              <input type="email" id="registerEmail" required />
            </div>
            <div class="form-group">
              <label for="registerPassword">Password (min 6 characters):</label>
              <input
                type="password"
                id="registerPassword"
                required
                minlength="6"
              />
            </div>
            <button type="submit">Register</button>
            <p>
              Already have an account?
              <a href="#" id="toggleLogin">Login here</a>
            </p>
          </form>

          <div id="authMessage" class="message"></div>
        </div>
      </section>
      <section id="appSection" style="display: none">
        <div class="header">
          <h1>Spend Tracker</h1>
          <button id="logoutBtn">Logout</button>
        </div>
        <section class="form-section">
          <h2>Add Expense</h2>
          <form id="expenseForm">
            <div class="form-group">
              <label for="amount">Amount:</label>
              <input type="number" id="amount" step="0.01" required />
            </div>
            <div class="form-group">
              <label for="category">Category:</label>
              <input type="text" id="category" required />
            </div>
            <div class="form-group">
              <label for="note">Note:</label>
              <input type="text" id="note" />
            </div>
            <div class="form-group">
              <label for="date">Date:</label>
              <input type="date" id="date" required />
            </div>
            <button type="submit">Add Expense</button>
          </form>
          <div id="formMessage" class="message"></div>
        </section>
        <section class="summary-section">
          <h2>Summary</h2>
          <div id="summaryContainer">
            <p>Loading summary...</p>
          </div>
        </section>
        <section class="list-section">
          <h2>Expenses</h2>
          <div class="filters">
            <div class="filter-group">
              <label for="filterCategory">Category:</label>
              <input type="text" id="filterCategory" />
            </div>
            <div class="filter-group">
              <label for="filterStartDate">Start Date:</label>
              <input type="date" id="filterStartDate" />
            </div>
            <div class="filter-group">
              <label for="filterEndDate">End Date:</label>
              <input type="date" id="filterEndDate" />
            </div>
            <button id="filterBtn">Filter</button>
            <button id="clearFilterBtn">Clear Filters</button>
          </div>
          <div id="expenseListContainer">
            <p>Loading expenses...</p>
          </div>
        </section>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
